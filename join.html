<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join IEEE O6U | Recruitment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: #f4f7f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

<div class="join-container">
    <h2 style="text-align: center; color: #00629B; margin-bottom: 10px;">IEEE O6U Recruitment</h2>
    <p style="text-align: center; color: #666; margin-bottom: 30px;">Become a part of our innovator community</p>
    
    <form action="https://formspree.io/f/mlgplrwl" method="POST">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>Academic Code (ID)</label>
            <input type="text" name="student_id" placeholder="Ex: 20231234" required>
        </div>

        <div class="form-group">
            <label>Select Your Team</label>
            <select name="team" required>
                <option value="" disabled selected>Choose a team...</option>
                <option value="HR">HR Team (Capacity: 6)</option>
                <option value="PR">PR Team (Capacity: 6)</option>
                <option value="OP">OP Team (Capacity: 9)</option>
                <option value="Biomedical">Biomedical Engineering (Max: 35)</option>
                <option value="Robotics">Robotics (Max: 35)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Phone Number (WhatsApp)</label>
            <input type="tel" name="phone" placeholder="01xxxxxxxxx" required>
        </div>

        <div class="form-group">
            <label>Why do you want to join?</label>
            <textarea name="message" rows="4" placeholder="Tell us about your skills..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Application</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px;">
        <a href="index.html" style="color: #00629B; text-decoration: none; font-weight: bold;">← Back to Home</a>
    </p>
</div>

</body>
</html>
